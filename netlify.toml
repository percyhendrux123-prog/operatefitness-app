[build]
  # Static HTML site — no package.json / no compile step.
  # No-op command ensures exit 0 even if Netlify UI still has a build script set.
  command = "true"
  publish = "."

[build.environment]
  # Skip any Node install attempts
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/peptides"
  to = "/peptides/"
  status = 200
