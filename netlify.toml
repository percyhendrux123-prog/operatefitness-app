[build]
  # Static source is copied into dist for Netlify's publish directory.
  # The public site has no runtime dependency on React, Vercel, Resend, or Supabase.
  command = "mkdir -p dist/peptides dist/policies dist/coachapp dist/assets netlify/functions && cp index.html robots.txt sitemap.xml dist/ && cp peptides/index.html dist/peptides/ && cp policies/index.html dist/policies/ && cp coachapp/index.html dist/coachapp/ && cp -r assets/. dist/assets/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
