[build]
  # UI still has publish directory = dist (legacy Vite app).
  # Copy static files into dist so deploy succeeds without dashboard changes.
  command = "mkdir -p dist/peptides dist/policies dist/assets netlify/functions && cp index.html robots.txt sitemap.xml dist/ && cp peptides/index.html dist/peptides/ && cp policies/index.html dist/policies/ && cp -r assets/. dist/assets/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
