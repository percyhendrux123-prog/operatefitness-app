[build]
  # UI still has publish directory = dist (legacy Vite app).
  # Copy static files into dist so deploy succeeds without dashboard changes.
  command = "mkdir -p dist/peptides dist/assets netlify/functions && cp index.html dist/ && cp peptides/index.html dist/peptides/ && cp -r assets/. dist/assets/ 2>/dev/null || true"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/peptides"
  to = "/peptides/"
  status = 200
